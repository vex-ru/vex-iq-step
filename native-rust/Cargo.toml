[package]
name = "vex-iq-viewer"
version = "1.0.0"
edition = "2021"
authors = ["VEX IQ CAD Community"]
description = "Ultra-fast native 3D CAD viewer & catalog for VEX IQ STL/3MF parts (Linux & Windows)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
glam = "0.29"
bytemuck = { version = "1.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.10", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.10", default-features = false, features = ["tls"] }
flate2 = "1.0"
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
